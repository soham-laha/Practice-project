name: Hosted website verification
on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Public frontend HTTPS origin (no credentials or path)
        required: true
        default: https://targetjee-studio.vercel.app
        type: string
      backend_url:
        description: New authorized backend HTTPS origin; leave empty for reference-frontend audit only
        required: false
        default: ''
        type: string
  # Bootstrap a public audit before this workflow is merged into main. A manual
  # dispatch becomes available once the workflow exists on the default branch.
  push:
    paths:
      - .github/workflows/hosted.yml
      - scripts/check-hosted.mjs
permissions:
  contents: read
concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-frontend:
    name: Hosted workflows and optional API integration · no real Gemini key
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SMOKE_FRONTEND_URL: ${{ inputs.frontend_url || 'https://targetjee-studio.vercel.app' }}
      SMOKE_BACKEND_URL: ${{ inputs.backend_url }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Validate public targets
        id: targets
        run: |
          node --input-type=module <<'JS'
          import { publicOrigin } from './scripts/check-hosted.mjs';
          publicOrigin(process.env.SMOKE_FRONTEND_URL);
          if (process.env.SMOKE_BACKEND_URL) publicOrigin(process.env.SMOKE_BACKEND_URL);
          JS
      - name: Public pages, notices and explicit backend availability
        run: node scripts/check-hosted.mjs
      - name: Hosted workflows, accessibility and optional API/CORS/upload transport
        env:
          TEST_BASE_URL: ${{ env.SMOKE_FRONTEND_URL }}
        run: npm run test:e2e
      - name: Full two-service smoke only when a real backend is supplied
        # Keep independent HTTP evidence even when a browser/validation case
        # fails, but never contact a target rejected by the origin guard.
        if: ${{ !cancelled() && steps.targets.outcome == 'success' && inputs.backend_url != '' }}
        run: npm run smoke
      - name: Explain incomplete production scope
        if: inputs.backend_url == ''
        run: echo '::notice title=Reference frontend only::Backend health, live Gemini and 20 MB upload/CORS remain unverified. This job is not full production acceptance.'
      - name: Preserve hosted browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hosted-reference-browser-audit
          path: |
            playwright-report
            test-results
            artifacts
          if-no-files-found: ignore
          retention-days: 7
