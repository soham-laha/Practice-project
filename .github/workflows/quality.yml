name: Quality & privacy gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: 1 · Static and production build
        run: npm run lint && npm run typecheck && python -m ruff check backend && python -m ruff format --check backend && npx prettier --check . && npm run build
      - name: 2 · Equations, symbolic guardrails and contracts
        run: python -m pytest backend/tests -q -W error && npm test && npm audit --audit-level=low && python -m pip check
      - name: 3 · Research, palette and font audit
        run: npm run audit:design
      - name: 4 · Start production-mode services
        run: |
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-access-log > /tmp/targetjee-api.log 2>&1 &
          TARGETJEE_API_BASE_URL=http://127.0.0.1:8000 npm start > /tmp/targetjee-web.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 http://127.0.0.1:8000/health --timeout 60000
      - name: 5 · Responsive, accessible, isolated local workflows
        run: npm run test:e2e
      - name: 6 · Production-mode local HTTP smoke
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            playwright-report
            test-results
            artifacts
          retention-days: 7
