name: Quality & privacy gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify · Node ${{ matrix.node }} / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24 action runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: 1 · Static and production build
        run: |
          npm run lint
          npm run typecheck
          python -m ruff check backend
          python -m ruff format --check backend
          npx prettier --check .
          npm run build
      - name: 2 · Equations, symbolic guardrails and contracts
        run: |
          python -m pytest backend/tests -q -W error
          npm test
          npm audit --audit-level=low
          python -m pip check
      - name: 3 · Research, palette and font audit
        run: npm run audit:design
      - name: 4 · Start production-mode services
        run: |
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-access-log > /tmp/targetjee-api.log 2>&1 &
          TARGETJEE_API_BASE_URL=http://127.0.0.1:8000 npm start > /tmp/targetjee-web.log 2>&1 &
          # FastAPI's GET /health does not implement HEAD. wait-on's plain
          # http:// scheme probes with HEAD and otherwise times out on 405.
          npx wait-on http-get://127.0.0.1:3000 http-get://127.0.0.1:8000/health --timeout 60000 --log
      - name: 5 · Responsive, accessible, isolated local workflows
        run: npm run test:e2e
      - name: 6 · Production-mode local HTTP smoke
        run: npm run smoke
      - name: Preserve browser evidence and service diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-audit-node-${{ matrix.node }}
          path: |
            playwright-report
            test-results
            artifacts
            /tmp/targetjee-api.log
            /tmp/targetjee-web.log
          if-no-files-found: ignore
          retention-days: 7
